name: Deploy to S3 and CloudFront

on:
  push:
    branches: ["main"]

permissions:
  id-token: write # required to request the GitHub OIDC token
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::373550664081:role/agulaldi-react-app-github-actions-deploy
  S3_BUCKET: agulaldi-react-app-373550664081
  CLOUDFRONT_DISTRIBUTION_ID: E1YQSA3SSDDP6X

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

      - name: Build React app
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync hashed static assets (immutable, 1 year)
        run: |
          aws s3 sync build/static "s3://${S3_BUCKET}/static" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync remaining files (no-cache)
        run: |
          aws s3 sync build/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "static/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
